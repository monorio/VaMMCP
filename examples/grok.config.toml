# Native Grok config. Copy the [mcp_servers.vam] block into
# %USERPROFILE%\.grok\config.toml (or a project .grok/config.toml).
# Replace both paths. VAM_ROOT must be the folder that contains VaM.exe.

[mcp_servers.vam]
command = 'C:\Path\To\VamMCP\mcp\.venv\Scripts\python.exe'
args = ["-m", "vam_mcp.server"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.vam.env]
VAM_ROOT = 'C:\Path\To\Your\VAM'
